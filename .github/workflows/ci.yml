name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile canonical runtime
        run: |
          python -m py_compile             runtime/bridge_server.py             runtime/google_bridge_tools.py             runtime/local_https_proxy.py             runtime/check_bridge_syntax.py             runtime/check_phone_bridge.py             runtime/validate_phone_integration.py             runtime/supervisor.py

      - name: Parse shell scripts
        run: |
          bash -n runtime/start_bridge.sh
          bash -n runtime/status_bridge.sh
          bash -n runtime/stop_bridge.sh
          bash -n update_termux.sh
          bash -n termuxbridgectl

      - name: Validate update safety contract
        run: |
          grep -Fq 'TERMUXBRIDGE_CHANNEL:-stable' update_termux.sh
          grep -Fq 'source_commit' update_termux.sh
          grep -Fq 'termux-job-scheduler' termuxbridgectl
          grep -Fq -- '--persisted true' termuxbridgectl
          grep -Fq 'TermuxBridge' runtime/bridge_server.py
          grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' TUNNEL_CLIENT_VERSION
          grep -Fq 'SHA256SUMS.txt' update_termux.sh
          grep -Fq 'tunnel-client-runtime' update_termux.sh
          grep -Fq 'CANDIDATE_HEALTHY' update_termux.sh
          grep -Fq 'SWITCHED' update_termux.sh
          grep -Fq 'DRAINING_OLD' update_termux.sh
          grep -Fq 'FAILED_ROLLED_BACK' update_termux.sh
          grep -Fq 'update_supervisor' update_termux.sh
          grep -Fq 'TRANSPORT_UPDATE' update_termux.sh
          grep -Fq 'X-Bridge-Token' runtime/supervisor.py
          grep -Fq 'X-Bridge-Backend-Token' runtime/supervisor.py
          grep -Fq '_backend_authorized' runtime/bridge_server.py
          grep -Fq 'if self.path == "/healthz"' runtime/supervisor.py
          grep -Fq 'raw.githubusercontent.com/ZTD38F/TermuxBridge/$SOURCE_COMMIT/runtime/supervisor.py' runtime/start_bridge.sh

          if grep -Eq '\$TMP/source/(runtime/)?(secrets|logs|bin|\.bridge-backup)/' update_termux.sh; then
            echo "Updater must not copy secret/log/binary/generated state from GitHub staging"
            exit 1
          fi

          for forbidden in secrets logs bin .bridge-backup jobs; do
            if grep -Eq "^[[:space:]]*$forbidden([[:space:]]|$)" update_termux.sh; then
              echo "Forbidden directory appears in MANAGED list: $forbidden"
              exit 1
            fi
          done

      - name: Verify release checksum uses downloaded asset filename
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("update_termux.sh").read_text()
          assert '-o "$TMP/$ASSET"' in text
          assert 'sha256sum -c source.sha256' in text
          assert 'tar -xzf "$TMP/$ASSET" -C "$TMP/source"' in text
          assert '-o "$TMP/source.tar.gz"' not in text[text.index('if [[ -n "$TARGET_TAG" ]]'):text.index('else\n  curl', text.index('if [[ -n "$TARGET_TAG" ]]'))]
          print("release checksum filename invariant passed")
          PY

      - name: Reject stop/start runtime update regression
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("update_termux.sh").read_text()
          normal=text[text.index("CANDIDATE="):text.index("# Transport updates")]
          assert 'stop_bridge.sh' not in normal, "ordinary runtime update must not stop the tunnel"
          print("seamless runtime invariant passed")
          PY

      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE             --exclude-dir=.git             --exclude='*.md'             '(sk-[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{16,}|tunnel_[0-9a-f]{32})' .; then
            echo "Potential credential committed to TermuxBridge"
            exit 1
          fi

      - name: Reject forbidden runtime state
        run: |
          test ! -e runtime/secrets
          test ! -e runtime/logs
          test ! -e runtime/bin
          test ! -e runtime/.bridge-backup
